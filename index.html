<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Memories</title>
    <style>
        html {
            background-color: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 20px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Times New Roman", Times, serif;
            background-image: url('Burgin The Bridge 1_0.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            box-sizing: border-box;
        }

        /* Container with no background, border, or padding */
        .content-container {
            color: #00ff00;
            text-align: left;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1rem;
            margin: 0 0 8px 0;
            color: #00ff00;
            text-transform: uppercase;
            font-weight: bold;
            background-color: rgba(255, 0, 0, 0.5);
            padding: 2px 6px;
            width: fit-content;
        }

        p {
            font-size: 1rem;
            margin: 0 0 8px 0;
            line-height: 1.3;
            color: #00ff00;
            background-color: rgba(255, 0, 0, 0.5);
            padding: 2px 6px;
            width: fit-content;
        }

        a {
            color: #00ff00;
            text-decoration: underline;
            font-size: 1rem;
        }

        a:hover {
            color: #00ff00;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1>Screen Memories</h1>
        <p>A podcast about psychoanalysis and the movies.</p>
        <p>Available on: <a href="https://www.youtube.com" target="_blank">YouTube</a>, <a href="https://spotify.com" target="_blank">Spotify</a>, <a href="https://podcasts.apple.com" target="_blank">Apple Podcasts</a></p>
        <p>Contact: <a href="mailto:info@screenmemories.xyz">info@screenmemories.xyz</a></p>
    </div>
</body>
</html>
